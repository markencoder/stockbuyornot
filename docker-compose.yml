services:
  stockbuyornot:
    build: .
    container_name: stockbuyornot
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      STOCKBUYORNOT_DB_PATH: /app/data/app.db
      STOCKBUYORNOT_ADMIN_EMAILS: ""
      STOCKBUYORNOT_BILLING_ENFORCED: "false"
      STOCKBUYORNOT_PAYMENT_AMOUNT_CNY: "99"
      STOCKBUYORNOT_PAYMENT_PROVIDER: manual_qr
      STOCKBUYORNOT_PAYMENT_QR_URL: ""
      STOCKBUYORNOT_SUPPORT_CONTACT: ""
    volumes:
      - ./data:/app/data
