[metadata]
name = stockbuyornot
version = 0.1.0
description = A-share volume-price signal interpreter for stock screening, timing signals, and backtesting.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    akshare>=1.14.0
    numpy>=1.20
    pandas>=1.2
    scikit-learn>=1.3
    statsmodels>=0.14

[options.extras_require]
ui =
    streamlit>=1.33
dev =
    pytest>=8.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    stockbuyornot = stockbuyornot.cli:main
